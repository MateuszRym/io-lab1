<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css?family=Orbitron" rel="stylesheet"/>
</head>
<body>
<header>
    <a th:href="@{/}"><h1>Library</h1></a>
    <h2 th:text="${title}"></h2>
    <h3></h3>
</header>
<section>
    <table>
        <tr>
            <th>Cover</th>
            <th>Title</th>
            <th>Author</th>
            <th>Rating</th>
            <th>Branches</th>
        </tr>
        <tr th:each="b : ${books}">
            <td>
                <img th:src="${b.cover}" alt="Book cover"/>
            </td>
            <td th:text="${b.title}"></td>
            <td>
                <a th:href="@{/authors?authorId={id}(id=${b.author.id})}"
                   th:text="${b.author.firstName} + ' ' + ${b.author.lastName}"></a>
            </td>
            <td class="rating" th:text="${b.rating}"></td>
            <td class="search-container">
                <a class="search" th:href="@{/branches?bookId={id}(id=${b.id})}"></a>
            </td>
        </tr>
    </table>
</section>
<div id="orders"></div>
<footer>
    ${tip}
</footer>
</body>
</html>
